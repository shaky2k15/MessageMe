# MessageMe — Detekt Configuration
# https://detekt.dev/docs/introduction/configurations

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

comments:
  active: true
  UndocumentedPublicFunction:
    active: true
    excludes: [ '**/test/**', '**/androidTest/**', '**/*Test.kt', '**/*Spec.kt' ]

complexity:
  active: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 20
    excludes: [ '**/test/**' ]
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
  CyclomaticComplexMethod:
    active: true
    threshold: 15

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'

potential-bugs:
  active: true

style:
  active: true
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: "Use Build.VERSION.SDK_INT >= S check. See ADR-005 and MessageRepository.sendSmsMessage for the correct pattern."
        value: "android.telephony.SmsManager.getDefault()"
      - reason: "GoogleSignIn is deprecated. Use Identity.getAuthorizationClient. See ADR-005."
        value: "com.google.android.gms.auth.api.signin.GoogleSignIn.getClient(android.content.Context, com.google.android.gms.auth.api.signin.GoogleSignInOptions)"
      - reason: "GoogleSignIn is deprecated. Use Identity.getAuthorizationClient. See ADR-005."
        value: "com.google.android.gms.auth.api.signin.GoogleSignIn.getSignedInAccountFromIntent(android.content.Intent)"
  MagicNumber:
    active: true
    ignoreNumbers: [ '-1', '0', '1', '2', '10', '100' ]
    ignoreAnnotated: [ 'androidx.compose.ui.tooling.preview.Preview' ]
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
    ignoreRanges: false
    ignoreExtensionFunctions: true
  UnusedImports:
    active: true
  WildcardImport:
    active: false

output-reports:
  active: true

processors:
  active: true
